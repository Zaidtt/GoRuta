<div class="login-page">
  <!-- Background video / overlay -->
  <div class="video-background">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="video/Video.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Header Nav Link -->
  <header class="login-header">
    <a routerLink="/" class="goruta-wordmark" aria-label="GoRuta, inicio">Go<span>Ruta</span></a>

    <a routerLink="/" class="back-home-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Volver al Inicio</span>
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="login-main">
    <div class="login-card">
      
      <div class="card-header"><h1 class="card-title">Iniciar sesión</h1><p class="card-subtitle">Ingresa para gestionar tus viajes y reservas.</p></div>
      <!-- Error / Success Alert Messages -->
      @if (errorMessage()) {
        <div class="alert-box error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      @if (successMessage()) {
        <div class="alert-box success" role="status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>{{ successMessage() }}</span>
        </div>
      }

      <!-- Login Form -->
      <form class="login-form" (ngSubmit)="onSubmit()">
        <!-- Email Input -->
        <div class="form-group">
          <label class="form-label" for="login-email">
            Correo electrónico
          </label>
          <div class="form-input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input
              id="login-email"
              type="text"
              class="form-input"
              placeholder="tu@correo.com"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="login-password">Contraseña</label>
          </div>
          <div class="form-input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              class="form-input"
              placeholder="••••••••"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="toggleShowPassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="remember-row">
          <label class="custom-check-container">
            <input
              type="checkbox"
              [checked]="rememberMe()"
              (change)="rememberMe.set(!rememberMe())"
            />
            <span class="custom-check"></span>
            <span class="remember-text">Mantener sesión iniciada</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn-login-submit"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner"></span>
            <span>Verificando credenciales...</span>
          } @else {
            <span>Iniciar Sesión</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          }
        </button>
      </form>

      <!-- Footer Info -->
      <div class="card-footer">
        <p class="footer-text">
          ¿No tienes una cuenta aún?
          <a routerLink="/crear-cuenta" queryParamsHandling="preserve" class="signup-link">Crea una cuenta gratuita</a>
        </p>
      </div>

    </div>
  </main>
</div>
